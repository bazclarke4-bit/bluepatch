<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play · Adventures of Blu and Pals</title>
<meta name="theme-color" content="#0b2a4a">
<style>
  :root { --navy: #0b2a4a; --ocean: #1474c8; --sky: #2a9df4; --gold: #ffc83d; --gold-d: #e0a100; --coral: #ff6b4a; --sand: #fff3d6; --ink: #13233a; --muted: #5b6b80; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif; color: var(--ink); background: #1592dd; overscroll-behavior: none; }
  button { font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 10px; z-index: 20;
    background: linear-gradient(180deg, rgba(11,42,74,.92), rgba(11,42,74,.78)); color: #fff; }
  .bar .btn { border: 2px solid rgba(255,255,255,.8); background: rgba(255,255,255,.12); color: #fff; border-radius: 12px; padding: 7px 11px; font-weight: 800; font-size: 15px; text-decoration: none; white-space: nowrap; }
  .bar .title { font-weight: 900; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .grow { flex: 1; min-width: 0; }
  .snd { width: 42px; height: 42px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.25); color: #fff; font-size: 19px; flex: none; }
  .chips { display: flex; gap: 6px; flex: none; }
  .chip { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.14); border: 2px solid transparent; border-radius: 999px; padding: 2px 9px 2px 3px; font-weight: 800; font-size: 13px; white-space: nowrap; }
  .chip img { width: 30px; height: 30px; object-fit: contain; background: #fff; border-radius: 50%; }
  .chip.on { border-color: var(--gold); background: rgba(255,200,61,.25); }
  .chip b { color: var(--gold); }
  /* map */
  #sea { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  #map { position: relative; height: 100%; }
  #map > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  #map svg.lay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .pin { position: absolute; transform: translate(-50%, -100%); border: 0; background: none; padding: 0; text-align: center; }
  .pin .tag { display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--navy); border-radius: 999px; padding: 6px 12px 6px 6px; font-weight: 900; font-size: clamp(13px, 1.9vh, 18px);
    box-shadow: 0 4px 0 rgba(0,0,0,.18), 0 8px 18px rgba(0,0,0,.2); white-space: nowrap; }
  .pin .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); font-size: 18px; }
  .pin .st { display: inline-block; margin-top: 5px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .6px; color: #fff; background: rgba(11,42,74,.75); padding: 3px 10px; border-radius: 999px; }
  .pin.open .tag { animation: bob 1.6s ease-in-out infinite; }
  .pin.open .st { color: #3a2500; background: var(--gold); box-shadow: 0 3px 0 var(--gold-d); }
  .pin.soon .tag { background: rgba(255,255,255,.82); color: #5b6b80; }
  .pin.soon .ic { background: #d6e0ea; filter: grayscale(.6); }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .hint { position: fixed; right: 12px; bottom: 14px; z-index: 5; background: rgba(11,42,74,.8); color: #fff; padding: 8px 14px; border-radius: 999px; font-weight: 800; pointer-events: none; transition: opacity .4s; }
  /* sheet */
  .shade { position: fixed; inset: 0; z-index: 40; background: rgba(5,20,40,.55); display: grid; place-items: center; padding: 16px; }
  .sheet { background: #fff; border-radius: 24px; padding: 20px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4); max-height: 90vh; overflow: auto; }
  .sheet h2 { margin: 6px 0; font-size: 28px; font-weight: 900; color: var(--navy); }
  .sheet .meta { color: var(--ocean); font-weight: 900; text-transform: uppercase; font-size: 13px; letter-spacing: .6px; }
  .sheet p { color: var(--muted); font-weight: 600; font-size: 16px; }
  .sheet img.pal { height: 110px; display: block; margin: 0 auto; }
  .big { display: block; width: 100%; border: 0; border-radius: 16px; padding: 14px; margin-top: 10px; font-size: 21px; font-weight: 900; color: #3a2500; background: linear-gradient(180deg, #ffd96b, var(--gold)); box-shadow: 0 5px 0 var(--gold-d); }
  .big.alt { background: #eef4fb; color: var(--navy); box-shadow: 0 5px 0 #c9d8ea; }
  .big:active { transform: translateY(3px); box-shadow: none; }
  /* golf */
  #golf { position: fixed; inset: 0; background: #2e7d32; }
  #gc { position: absolute; top: 56px; left: 0; width: 100%; height: calc(100% - 56px); touch-action: none; display: block; }
  .shots { font-weight: 900; font-size: 15px; white-space: nowrap; }
  table.score { width: 100%; border-collapse: collapse; margin: 10px 0; font-weight: 800; font-size: 14px; }
  table.score th, table.score td { padding: 6px 3px; border-bottom: 1px solid #e3ebf4; }
  table.score th { color: var(--muted); font-size: 12px; }
  table.score td.tot { color: var(--ocean); font-size: 17px; }
  table.score tr.win td { background: #fff6d9; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 45; }
  @media (max-width: 560px) { .bar .title { font-size: 15px; } #mapScreen .bar .title { visibility: hidden; } .chip span.n { max-width: 64px; overflow: hidden; text-overflow: ellipsis; } }
</style>
</head>

function tn(f, f2, d, type, v, w, vr, vd, filt) {
  var c = ac(), o2 = out(); if (!c || !o2) return;
  var t = c.currentTime + (w || 0), o = c.createOscillator(), g = c.createGain(), last = g;
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  if (vr) { var l = c.createOscillator(), lg = c.createGain(); l.frequency.value = vr; lg.gain.value = vd; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + d + 0.05); }
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); if (filt) { var bf = c.createBiquadFilter(); bf.type = filt[0]; bf.frequency.value = filt[1]; bf.Q.value = filt[2] || 1; g.connect(bf); last = bf; }
  last.connect(o2); o.start(t); o.stop(t + d + 0.05);

  var t = c.currentTime + (w || 0), s = c.createBufferSource(), bf = c.createBiquadFilter(), g = c.createGain(); s.buffer = noiseBuf;
  bf.type = type; bf.frequency.setValueAtTime(fr, t); if (fr2) bf.frequency.exponentialRampToValueAtTime(fr2, t + d); bf.Q.value = q || 1;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(bf); bf.connect(g); g.connect(o2); s.start(t); s.stop(t + d + 0.05);
}
